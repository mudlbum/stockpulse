name: Refresh data and rank

# ─────────────────────────────────────────────────────────────────────────────
# SCHEDULE — and why it is not the one in the original spec.
#
# The original plan (04:00 / 08:00 / 08:30 / 16:30 EST) assumes pre-market and
# intraday data. There is no keyless, license-clean source for either, so the
# pipeline is end-of-day, and the honest cadence is POST-CLOSE: score the
# session that just finished and publish for the next one. Every board states
# its as-of date and says the earliest actionable point is the next open.
#
# GitHub Actions cron is UTC-only and free-tier runs are routinely delayed
# 10–60 minutes at popular times, so nothing here depends on firing at an exact
# minute. Times are offset off the hour to sit outside the worst congestion.
#
#   21:35 UTC  = 17:35 ET  → US post-close (16:00 ET + settle buffer)
#   07:10 UTC  = 16:10 KST → KR post-close (15:30 KST + settle buffer)
#   Both are followed by rank + evaluate in the same job so the store is
#   internally consistent when it is committed.
#
# US DST NOTE: 21:35 UTC is 17:35 EDT in summer and 16:35 EST in winter. The
# winter time is still 35 minutes after the 16:00 EST close, so a single cron
# is correct year-round. This is deliberate — a DST-tracking pair of crons
# would double-run for one week each year.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '35 21 * * 1-5'   # US post-close
    - cron: '10 7 * * 1-5'    # KR post-close
    - cron: '0 */4 * * *'     # news only
  workflow_dispatch:
    inputs:
      market:
        description: 'Which refresh to run'
        type: choice
        options: [both, us, kr, news]
        default: both
      bootstrap:
        description: 'Tickers to backfill history for this run'
        default: '120'

concurrency:
  # Never let two refreshes race on the committed store — a lost update there
  # is a silently corrupted price series, not a failed build.
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write
  # `actions: write` is what lets this job dispatch deploy.yml. Without it the
  # dispatch returns 403 "Resource not accessible by integration", the refresh
  # goes green having committed fresh rankings, and the published site never
  # rebuilds. The pipeline looks healthy and the site quietly stops updating —
  # which is the failure mode this whole workflow exists to prevent.
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'hello@example.com' }}
      US_BOOTSTRAP: ${{ github.event.inputs.bootstrap || '120' }}
      KR_BOOTSTRAP: '90'
      # Optional. Without it the Korean pipeline runs exactly as before and the
      # mid-term, long-term and ultra-long Korean boards stay empty, each saying
      # why. With it, refresh-kr backfills audited statements from the regulator
      # and those three boards become computable. Secrets are masked in logs,
      # and an unset secret expands to an empty string, which the script treats
      # as "not configured" rather than as a bad key.
      DART_KEY: ${{ secrets.DART_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Decide what to run
        id: plan
        run: |
          MODE="${{ github.event.inputs.market }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              '35 21 * * 1-5') MODE=us ;;
              '10 7 * * 1-5')  MODE=kr ;;
              *)               MODE=news ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Running mode: $MODE"

      - name: Refresh US
        if: steps.plan.outputs.mode == 'us' || steps.plan.outputs.mode == 'both'
        run: npm run refresh:us

      - name: Refresh KR
        if: steps.plan.outputs.mode == 'kr' || steps.plan.outputs.mode == 'both'
        run: npm run refresh:kr

      - name: Refresh news
        run: npm run refresh:news

      # Ranking and evaluation are pure functions of the store, so they run on
      # every mode — including news-only, which changes the sentiment factor.
      - name: Rank
        run: npm run rank

      - name: Evaluate performance
        run: npm run evaluate

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Refresh summary (${{ steps.plan.outputs.mode }})"
            echo
            if [ -f public/data/health.json ]; then
              echo '### Source health'
              node -e "
                const h=require('./public/data/health.json');
                for (const s of h.sources ?? []) console.log('- ' + s.host + ': ' + s.ok + ' ok / ' + s.fail + ' fail' + (s.notes?.length ? ' (' + s.notes.join(', ') + ')' : ''));
              " || true
            fi
            if [ -f public/data/news.json ]; then
              echo
              echo '### Feed health'
              node -e "
                const n=require('./public/data/news.json');
                for (const f of n.feedHealth ?? []) console.log('- ' + f.status.padEnd(6) + ' ' + f.name + (f.error ? ' — ' + f.error : '') + (f.newestAgeHours != null ? ' (newest ' + f.newestAgeHours + 'h)' : ''));
              " || true
            fi
            if [ -f public/data/rankings.json ]; then
              echo
              echo '### Boards'
              node -e "
                const r=require('./public/data/rankings.json');
                for (const m of ['US','KR']) for (const h of Object.keys(r.boards[m] ?? {})) {
                  const b=r.boards[m][h];
                  console.log('- ' + m + '/' + h + ': ' + b.rows.length + ' rows' + (b.emptyReason ? ' — ' + b.emptyReason.code : ''));
                }
                for (const m of ['US','KR']) if (r.regime[m]) console.log('- regime ' + m + ': ' + r.regime[m].state);
              " || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        run: |
          git config user.name 'stockpulse-bot'
          git config user.email 'stockpulse-bot@users.noreply.github.com'
          # -f because data-store/ is gitignored: it must never be committed
          # from a developer machine (a local smoke run fills it with fixture
          # data), but this workflow is exactly the thing that should write it.
          git add -f data-store public/data src/data
          if git diff --staged --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "data: refresh ${{ steps.plan.outputs.mode }} $(date -u +%Y-%m-%dT%H:%MZ)"
          # The store is committed by other runs too; rebase rather than fail.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          exit 1

      # GITHUB_TOKEN pushes do not trigger other workflows, so the deploy is
      # dispatched explicitly. With a PAT_TOKEN secret the commit would trigger
      # deploy.yml directly and this step becomes unnecessary.
      # GITHUB_TOKEN pushes deliberately do not trigger other workflows, so the
      # deploy that actually republishes the site has to be dispatched here.
      #
      # This step used to end in `|| true`. That is the wrong place for a
      # swallow: the data is already committed by the time we get here, so a
      # failed dispatch loses nothing but leaves the site stale, and hiding it
      # means nobody finds out until they notice the numbers have not moved for
      # a week. Fail loudly instead — the refresh has done its job either way.
      - name: Trigger deploy
        if: success()
        run: |
          if gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"; then
            echo "deploy dispatched"
          else
            echo "::error::Data was committed but deploy.yml could not be dispatched." \
                 "The site will keep serving the previous build until this is fixed." \
                 "Check that this workflow has 'actions: write' permission."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
